<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 國中小基本 1000 單字 - 每 20 單字遊戲化學習網頁</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .game-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        }
        .game-btn:active {
            transform: translateY(1px) scale(0.98);
        }
        /* Monopoly board styling */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            aspect-ratio: 1 / 1;
        }
        .board-tile {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            position: relative;
            font-size: 0.75rem;
            text-align: center;
            transition: all 0.2s ease;
        }
        .board-tile.active-player {
            border-color: #f59e0b;
            box-shadow: 0 0 15px #f59e0b;
            background: rgba(245, 158, 11, 0.2);
            transform: scale(1.05);
            z-index: 10;
        }
        .board-tile.bought {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.15);
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-only { display: block !important; }
            .glass-card { background: none !important; border: none !important; box-shadow: none !important; color: black !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="p-3 md:p-6">
    <!-- Top Navigation & Header -->
    <header class="max-w-6xl mx-auto mb-6 no-print">
        <div class="glass-card rounded-2xl p-4 md:p-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-2xl shadow-lg">
                    🎮
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
                        國中小基本 1000 單字遊戲館
                    </h1>
                    <p class="text-xs text-slate-400">每 20 個單字獨立一組遊戲 • 多重互動玩法 • 發音與練習</p>
                </div>
            </div>

            <!-- Group Selector -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <label for="groupSelect" class="text-sm font-semibold text-indigo-300 whitespace-nowrap">
                    <i class="fa-solid fa-layer-group mr-1"></i>選擇單字組：
                </label>
                <select id="groupSelect" onchange="changeGroup(this.value)" class="w-full md:w-72 bg-slate-800 border border-indigo-500/30 text-indigo-100 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </select>
            </div>
        </div>

        <!-- Mode Pills -->
        <div class="flex flex-wrap items-center justify-center gap-2 mt-4">
            <button onclick="switchMode('cards')" id="btn-cards" class="mode-tab game-btn bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-clone"></i> 🗂️ 20單字特訓卡
            </button>
            <button onclick="switchMode('monopoly')" id="btn-monopoly" class="mode-tab game-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
                <i class="fa-solid fa-dice"></i> 🎲 20格大富翁
            </button>
            <button onclick="switchMode('gacha')" id="btn-gacha" class="mode-tab game-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
                <i class="fa-solid fa-gift"></i> 🎁 盲盒抽卡養成
            </button>
            <button onclick="switchMode('quiz')" id="btn-quiz" class="mode-tab game-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
                <i class="fa-solid fa-square-check"></i> 📝 隨堂測驗小考
            </button>
            <button onclick="window.print()" class="game-btn bg-emerald-600/80 hover:bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 ml-auto">
                <i class="fa-solid fa-print"></i> 🖨️ 列印 A4 學習單
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="max-w-6xl mx-auto no-print">
        <!-- 1. Flashcards Mode -->
        <section id="mode-cards" class="mode-section space-y-4">
            <div class="glass-card rounded-2xl p-4 md:p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-indigo-300 flex items-center gap-2">
                        <i class="fa-solid fa-volume-high"></i> 本組 20 單字清單與真人發音
                    </h2>
                    <span id="groupCardHeader" class="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full font-semibold"></span>
                </div>
                <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                    <!-- Dynamic cards inserted by JS -->
                </div>
            </div>
        </section>

        <!-- 2. Monopoly Mode -->
        <section id="mode-monopoly" class="mode-section hidden space-y-4">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Board Left -->
                <div class="lg:col-span-2 glass-card rounded-2xl p-4 md:p-6">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
                            <i class="fa-solid fa-chess-board"></i> 環形 20 格單字大富翁
                        </h2>
                        <div class="flex items-center gap-3 text-sm font-bold">
                            <span class="text-emerald-400"><i class="fa-solid fa-coins mr-1"></i>金幣: <span id="mCoins">500</span></span>
                            <span class="text-purple-400"><i class="fa-solid fa-rotate-right mr-1"></i>圈數: <span id="mLaps">0</span></span>
                        </div>
                    </div>
                    <!-- 6x6 Grid for 20 outer tiles -->
                    <div id="monopolyBoard" class="board-grid">
                        <!-- Tiles generated by JS -->
                    </div>
                </div>

                <!-- Game Console Right -->
                <div class="glass-card rounded-2xl p-4 md:p-6 flex flex-col justify-between">
                    <div>
                        <div class="border-b border-slate-700 pb-3 mb-4">
                            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">答題解鎖甩骰</span>
                            <h3 id="mQuestionText" class="text-2xl font-bold text-indigo-200 mt-1">載入中...</h3>
                            <p class="text-xs text-indigo-400 mt-1">請選擇正確的中文字義：</p>
                        </div>
                        <div id="mOptions" class="space-y-2 mb-4">
                            <!-- Options inserted by JS -->
                        </div>
                    </div>

                    <div class="space-y-3 pt-4 border-t border-slate-700">
                        <div id="mDiceStatus" class="text-center text-xs font-semibold text-slate-400">
                            回答正確即可獲得親手甩骰機會！
                        </div>
                        <button id="btnRollDice" onclick="rollDice()" disabled class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-900 font-extrabold rounded-xl shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center justify-center gap-2 text-base">
                            <i class="fa-solid fa-dice-five text-xl"></i> 親手擲骰子移動
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. Gacha Mode -->
        <section id="mode-gacha" class="mode-section hidden space-y-4">
            <div class="glass-card rounded-2xl p-6 text-center space-y-6">
                <h2 class="text-2xl font-bold text-pink-400"><i class="fa-solid fa-gift mr-2"></i>盲盒扭蛋卡牌館</h2>
                <p class="text-sm text-slate-300">答題積攢代幣，解鎖本組 20 單字對應的魔法冒險圖鑑！</p>
                <div class="flex justify-center items-center gap-6">
                    <div class="bg-slate-800/80 px-6 py-3 rounded-2xl border border-pink-500/30">
                        <span class="text-xs text-slate-400 block">盲盒星幣</span>
                        <span id="gachaCoins" class="text-2xl font-black text-amber-400">500</span>
                    </div>
                </div>
                <div class="py-4">
                    <button onclick="drawGacha()" class="game-btn px-8 py-4 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-black text-lg rounded-2xl shadow-xl shadow-pink-500/30">
                        <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> 消耗 50 金幣開箱盲盒！
                    </button>
                </div>
                <div id="gachaResult" class="min-h-[140px] flex items-center justify-center">
                    <p class="text-slate-400 text-sm">點擊上方按鈕開啟盲盒！</p>
                </div>
            </div>
        </section>

        <!-- 4. Quiz Mode -->
        <section id="mode-quiz" class="mode-section hidden space-y-4">
            <div class="glass-card rounded-2xl p-6">
                <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-4">
                    <h2 class="text-lg font-bold text-emerald-400"><i class="fa-solid fa-pen-to-square mr-2"></i>本組 20 單字綜合評量</h2>
                    <span id="quizScore" class="text-sm font-bold bg-emerald-500/20 text-emerald-300 px-4 py-1.5 rounded-full">得分：0 / 20</span>
                </div>
                <div id="quizContainer" class="space-y-6">
                    <!-- Quiz questions inserted by JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- Print View Container -->
    <section class="print-only p-8">
        <h1 class="text-2xl font-bold text-center mb-2">國中小基本一千字 - 隨堂單字學習單</h1>
        <p id="printGroupTitle" class="text-center font-semibold mb-6 text-gray-700"></p>
        <table class="w-full border-collapse border border-gray-400 text-sm">
            <thead>

                    <th class="border border-gray-400 p-2 w-12 text-center">No.</th>
                    <th class="border border-gray-400 p-2 text-left">英文單字 (English)</th>
                    <th class="border border-gray-400 p-2 text-left">中文解釋 (Chinese)</th>
                    <th class="border border-gray-400 p-2 w-36 text-center">自我檢核/畫記</th>
                </tr>
            </thead>
            <tbody id="printTableBody">
                <!-- Inserted by JS -->
            </tbody>
        </table>
    </section>

            {"w":"wrong","t":"不對的"},{"w":"yeah","t":"是(yes)"},{"w":"year","t":"年"},{"w":"yellow","t":"黃色的"},{"w":"yes","t":"是"},{"w":"yesterday","t":"昨天"},{"w":"yet","t":"尚；未"},{"w":"you","t":"你；你們"},{"w":"young","t":"年輕的"},{"w":"your","t":"你的；你們的"},{"w":"yours","t":"你的/你們的東西"},{"w":"yourself","t":"你自己"},{"w":"yourselves","t":"你們自己"},{"w":"zoo","t":"動物園"}

        // Build 20-word groups
        const vocabGroups = [];
        const chunkSize = 20;
        for (let i = 0; i < rawWords.length; i += chunkSize) {
            const chunk = rawWords.slice(i, i + chunkSize);
            const firstW = chunk[0].w;
            const lastW = chunk[chunk.length - 1].w;
            const groupId = Math.floor(i / chunkSize) + 1;
            vocabGroups.push({
                id: groupId,
                name: `第 ${String(groupId).padStart(2, '0')} 組：${firstW} ~ ${lastW} (${chunk.length}字)`,
                words: chunk
            });
        }

        let currentGroupId = 1;
        let currentWords = [];
        let monopolyState = {
            playerPos: 0,
            coins: 500,
            laps: 0,
            canRoll: false
        };

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            populateGroupDropdown();
            loadGroup(1);
        });

        function populateGroupDropdown() {
            const select = document.getElementById('groupSelect');
            select.innerHTML = '';
            vocabGroups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = g.name;
                select.appendChild(opt);
            });
        }

        function changeGroup(id) {
            currentGroupId = parseInt(id);
            loadGroup(currentGroupId);
        }

        function loadGroup(groupId) {
            const group = vocabGroups.find(g => g.id === groupId);
            if (!group) return;
            currentWords = group.words;

            document.getElementById('groupCardHeader').textContent = group.name;
            document.getElementById('printGroupTitle').textContent = group.name;

            renderCards();
            initMonopoly();
            renderPrintTable();
            renderQuiz();
        }

        // --- 1. Flashcards Mode ---
        function renderCards() {
            const container = document.getElementById('cardsGrid');
            container.innerHTML = '';
            currentWords.forEach((wordObj, idx) => {
                const card = document.createElement('div');
                card.className = 'glass-card p-4 rounded-xl flex flex-col justify-between hover:border-indigo-400/50 transition cursor-pointer group';
                card.onclick = () => speak(wordObj.w);
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-indigo-400">#${idx+1}</span>
                        <button class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500 hover:text-white flex items-center justify-center transition">
                            <i class="fa-solid fa-volume-high text-xs"></i>
                        </button>
                    </div>
                    <div class="text-center py-3">
                        <h3 class="text-xl font-black text-indigo-100 group-hover:text-amber-300 transition">${wordObj.w}</h3>
                        <p class="text-sm font-semibold text-slate-300 mt-1">${wordObj.t}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const cleanText = text.replace(/\(.*?\)/g, '').trim();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 2. Monopoly Mode ---
        function initMonopoly() {
            monopolyState.playerPos = 0;
            monopolyState.canRoll = false;
            document.getElementById('mCoins').textContent = monopolyState.coins;
            document.getElementById('mLaps').textContent = monopolyState.laps;

            renderBoard();
            nextMonopolyQuestion();
        }

        function renderBoard() {
            const board = document.getElementById('monopolyBoard');
            board.innerHTML = '';

            const tileCoords = [];
            for (let c = 0; c < 6; c++) tileCoords.push({r: 0, c: c}); 
            for (let r = 1; r < 6; r++) tileCoords.push({r: r, c: 5}); 
            for (let c = 4; c >= 0; c--) tileCoords.push({r: 5, c: c}); 
            for (let r = 4; r >= 1; r--) tileCoords.push({r: r, c: 0}); 

            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 6; c++) {
                    const tileIdx = tileCoords.findIndex(coord => coord.r === r && coord.c === c);
                    const tileEl = document.createElement('div');

                    if (tileIdx !== -1) {
                        const wordObj = currentWords[tileIdx];
                        const isPlayer = (tileIdx === monopolyState.playerPos);

                        tileEl.className = `board-tile ${isPlayer ? 'active-player' : ''}`;
                        tileEl.style.gridRow = r + 1;
                        tileEl.style.gridColumn = c + 1;

                        tileEl.innerHTML = `
                            <span class="text-[10px] text-slate-400 font-bold">#${tileIdx+1}</span>
                            <span class="font-extrabold text-indigo-200 leading-tight">${wordObj ? wordObj.w : 'GO'}</span>
                            ${isPlayer ? '<span class="absolute -top-2 -right-2 text-lg">🏃</span>' : ''}
                        `;
                    } else {
                        if (r === 1 && c === 1) {
                            tileEl.className = 'col-span-4 row-span-4 bg-slate-900/60 rounded-xl border border-indigo-500/20 p-4 flex flex-col items-center justify-center text-center';
                            tileEl.style.gridRow = '2 / 6';
                            tileEl.style.gridColumn = '2 / 6';
                            tileEl.innerHTML = `
                                <i class="fa-solid fa-dice-d20 text-4xl text-indigo-400 mb-2"></i>
                                <span class="text-xs text-slate-300 font-bold">大富翁單字冒險樂園</span>
                                <span class="text-[10px] text-slate-400 mt-1">答對單字 ➔ 解鎖甩骰 ➔ 步步前進繞圈領雙倍獎勵！</span>
                            `;
                        } else {
                            continue;
                        }
                    }
                    board.appendChild(tileEl);
                }
            }
        }

        function nextMonopolyQuestion() {
            monopolyState.canRoll = false;
            document.getElementById('btnRollDice').disabled = true;
            document.getElementById('mDiceStatus').textContent = "請選擇正確的答案以解鎖甩骰！";

            const qWord = currentWords[Math.floor(Math.random() * currentWords.length)];
            document.getElementById('mQuestionText').textContent = qWord.w;

            const options = [qWord.t];
            while (options.length < 4) {
                const randWord = currentWords[Math.floor(Math.random() * currentWords.length)];
                if (!options.includes(randWord.t)) options.push(randWord.t);
            }
            options.sort(() => Math.random() - 0.5);

            const optContainer = document.getElementById('mOptions');
            optContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-2.5 px-4 bg-slate-800 hover:bg-indigo-600/80 text-left text-sm font-semibold rounded-xl border border-slate-700 transition flex items-center justify-between group';
                btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-check opacity-0 group-hover:opacity-100 text-emerald-400 transition"></i>`;
                btn.onclick = () => {
                    if (opt === qWord.t) {
                        monopolyState.canRoll = true;
                        document.getElementById('btnRollDice').disabled = false;
                        document.getElementById('mDiceStatus').innerHTML = "<span class='text-emerald-400 font-bold'>🎉 答對了！點擊下方按鈕親手甩骰子！</span>";
                        btn.className = 'w-full py-2.5 px-4 bg-emerald-600 text-white text-left text-sm font-semibold rounded-xl border border-emerald-400';
                        playAudioTone(600, 'sine', 0.15);
                    } else {
                        document.getElementById('mDiceStatus').innerHTML = "<span class='text-rose-400 font-bold'>❌ 答錯囉！請再試試其他選項！</span>";
                        btn.className = 'w-full py-2.5 px-4 bg-rose-900/50 text-rose-200 text-left text-sm font-semibold rounded-xl border border-rose-500';
                        playAudioTone(200, 'square', 0.2);
                    }
                };
                optContainer.appendChild(btn);
            });
        }

        function rollDice() {
            if (!monopolyState.canRoll) return;
            monopolyState.canRoll = false;
            document.getElementById('btnRollDice').disabled = true;

            const diceRoll = Math.floor(Math.random() * 4) + 1;
            let oldPos = monopolyState.playerPos;
            monopolyState.playerPos = (monopolyState.playerPos + diceRoll) % 20;

            if (monopolyState.playerPos < oldPos) {
                monopolyState.laps += 1;
                monopolyState.coins += 150;
                document.getElementById('mLaps').textContent = monopolyState.laps;
                document.getElementById('mCoins').textContent = monopolyState.coins;
            }

            renderBoard();
            speak(currentWords[monopolyState.playerPos].w);

            setTimeout(() => {
                nextMonopolyQuestion();
            }, 1200);
        }

        // --- 3. Gacha Mode ---
        function drawGacha() {
            if (monopolyState.coins < 50) {
                alert("金幣不足！請至大富翁答題賺取金幣！");
                return;
            }
            monopolyState.coins -= 50;
            document.getElementById('gachaCoins').textContent = monopolyState.coins;
            document.getElementById('mCoins').textContent = monopolyState.coins;

            const item = currentWords[Math.floor(Math.random() * currentWords.length)];
            const rareList = ['R 普通夥伴', 'SR 稀有冒險者', 'SSR 傳說魔法神獸'];
            const rare = rareList[Math.floor(Math.random() * rareList.length)];

            document.getElementById('gachaResult').innerHTML = `
                <div class="glass-card p-4 rounded-2xl border-2 border-amber-400 text-center animate-bounce">
                    <span class="text-xs font-bold text-amber-400">${rare}</span>
                    <h3 class="text-2xl font-black text-white mt-1">${item.w}</h3>
                    <p class="text-sm text-slate-300">${item.t}</p>
                </div>
            `;
            playAudioTone(800, 'triangle', 0.3);
        }

        // --- 4. Quiz Mode ---
        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            currentWords.forEach((wordObj, idx) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'p-4 rounded-xl bg-slate-800/60 border border-slate-700 space-y-2';

                const distractors = [wordObj.t];
                while (distractors.length < 4) {
                    const r = currentWords[Math.floor(Math.random() * currentWords.length)].t;
                    if (!distractors.includes(r)) distractors.push(r);
                }
                distractors.sort(() => Math.random() - 0.5);

                let optionsHTML = '';
                distractors.forEach(opt => {
                    optionsHTML += `
                        <label class="flex items-center gap-2 p-2 bg-slate-900/50 rounded-lg hover:bg-indigo-600/30 cursor-pointer border border-slate-800">
                            <input type="radio" name="q_${idx}" value="${opt}" onchange="checkQuizScore()" class="text-indigo-500">
                            <span class="text-sm font-medium text-slate-200">${opt}</span>
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <div class="font-bold text-indigo-300">#${idx+1}. <span class="text-white text-lg ml-1">${wordObj.w}</span></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">${optionsHTML}</div>
                `;
                container.appendChild(qDiv);
            });
        }

        function checkQuizScore() {
            let score = 0;
            currentWords.forEach((wordObj, idx) => {
                const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
                if (selected && selected.value === wordObj.t) {
                    score++;
                }
            });
            document.getElementById('quizScore').textContent = `得分：${score} / 20`;
        }

        // Print View
        function renderPrintTable() {
            const tbody = document.getElementById('printTableBody');
            tbody.innerHTML = '';
            currentWords.forEach((w, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="border border-gray-400 p-2 text-center font-bold">${i+1}</td>
                    <td class="border border-gray-400 p-2 font-semibold">${w.w}</td>
                    <td class="border border-gray-400 p-2">${w.t}</td>
                    <td class="border border-gray-400 p-2 text-center text-gray-400 text-xs">□ 精熟  □ 需複習</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Mode Switching
        function switchMode(mode) {
            document.querySelectorAll('.mode-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.mode-tab').forEach(el => {
                el.classList.remove('bg-indigo-600', 'text-white');
                el.classList.add('bg-slate-800', 'text-slate-300');
            });

            document.getElementById(`mode-${mode}`).classList.remove('hidden');
            const btn = document.getElementById(`btn-${mode}`);
            if (btn) {
                btn.classList.remove('bg-slate-800', 'text-slate-300');
                btn.classList.add('bg-indigo-600', 'text-white');
            }
        }

        // Audio synthesizer
        function playAudioTone(freq, type, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }
    </script>
